policy_groups:
- external:
    name: '1'
    type: select
    urls:
    - https://liangxin.xyz/api/v1/liangxin?OwO=f5018dc9a9dda874dbc8d42edb6f0808
    icon: https://cdn.nodeimage.com/i/8vygBRNBN0vG9E2aaeShetE6NmQr58UZ.webp
    hidden: false
- select:
    name: PROXY
    policies:
    - 美国
    - 日本
    - 新加坡
    - 香港
    - DIRECT
    flatten: false
    icon: https://raw.githubusercontent.com/xushier/HD-Icons/main/border-radius/clash-1.png
    hidden: false
- select:
    name: 香港
    policies:
    - '1'
    flatten: true
    filter: 🇭🇰|Hong Kong|Hong|HK|HKG|香港
    icon: https://iili.io/FaAI3Bt.png
    hidden: false
- select:
    name: 新加坡
    policies:
    - '1'
    flatten: true
    filter: 🇸🇬|新加坡|Singapore|SG
    icon: https://iili.io/FaRfFXn.png
    hidden: false
- select:
    name: 日本
    policies:
    - '1'
    flatten: true
    filter: 🇯🇵|日本|Japan|JP
    icon: https://iili.io/Fa5AnTb.png
    hidden: false
- select:
    name: 美国
    policies:
    - '1'
    flatten: true
    filter: 🇺🇸|美国|United States|USA|US|States
    icon: https://iili.io/FaAug7s.png
    hidden: false
