auto_update:
  url: https://raw.githubusercontent.com/huamidev/Egern/refs/heads/main/huami.yaml
  interval: 86400
ipv6: true
http_port: 6152
socks_port: 6153
allow_external_connections: true
vif_only: true
block_quic: true
close_connections_on_policy_change: true
hide_vpn_icon: false
geoip_db_url: https://git.io/GeoLite2-City.mmdb
asn_db_url: https://git.io/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://connectivitycheck.gstatic.com/generate_204
direct_latency_test_url: http://www.qq.com
udp_latency_test_url: google.com@8.8.8.8
compat_route: true
include_all_networks: false
include_apns: false

dns:
  bootstrap:
  - system
  - 223.5.5.5
  - 223.6.6.6
  - 119.28.28.28
  - 119.29.29.29
  - 180.76.76.76
  - 2400:da00::6666
  upstreams:
    DIRECT-DNS:
    - 180.76.76.76
    - 2400:da00::6666
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    MIX-DNS:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - https://cloudflare-dns.com/dns-query
    PROXY-DNS:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  forward:
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/Rabbit-Spec/Surge/refs/heads/Master/Rules/China.list
      value: DIRECT-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/GMOogway/shadowrocket-rules/master/sr_direct_list.module
      value: DIRECT-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/Rabbit-Spec/Surge/refs/heads/Master/Rules/ChinaCIDR.list
      value: DIRECT-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Lan/Lan.yaml
      value: DIRECT-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/ChinaIPsBGP/ChinaIPsBGP.yaml
      value: DIRECT-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/ChinaMaxNoIP/ChinaMaxNoIP.yaml
      value: DIRECT-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Direct/Direct.yaml
      value: DIRECT-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Apple/Apple.yaml
      value: DIRECT-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Cloudflare/Cloudflare.yaml
      value: PROXY-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/GMOogway/shadowrocket-rules/master/sr_proxy_list.module
      value: PROXY-DNS
      disabled: false
  - proxy_rule_set:
      match: https://yfamilys.com/rule/ProxyMedia.list
      value: PROXY-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Proxy/Proxy.yaml
      value: PROXY-DNS
      disabled: false
  - domain_wildcard:
      match: '*'
      value: PROXY-DNS
      disabled: false
  proxy_nameservers:
  - MIX-DNS
  hosts:
    dns.google:
    - 8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, 2001:4860:4860::8844
    cloudflare-dns.com:
    - 104.16.249.249, 104.16.248.249, 2606:4700::6810:f8f9, 2606:4700::6810:f9f9
    dns.alidns.com:
    - 223.5.5.5, 223.6.6.6, 2400:3200:baba::1, 2400:3200::1
    doh.pub:
    - 1.12.12.12, 120.53.53.53
    dot.pub:
    - 1.12.12.12, 120.53.53.53
